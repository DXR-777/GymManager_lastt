plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.gympro.manager'
    compileSdk 34

    defaultConfig {
        applicationId "com.gympro.manager"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true

        // البند 18: يمنع تعبئة موارد المكتبات (Material/AppCompat) بلغات أخرى غير
        // العربية. بدون هذا، مستخدم بلغة نظام مثلاً فرنسية كان سيحصل على نصوص
        // التطبيق بالعربية ونصوص أزرار الحوارات القياسية ("إلغاء"/"موافق") بالفرنسية
        // في نفس الشاشة — تجربة مختلطة عن غير قصد. "ar" هنا يجعل القرار (عربي فقط
        // حالياً) ساري الفعل عملياً في كل الموارد، لا في strings.xml وحده.
        resConfigs "ar"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    // البند 24: يوفّر PagingSource جاهزاً من Room مباشرة لاستعلامات قائمة الأعضاء
    // النشطين (راجع MemberDao.getActiveMembersPagedByName/ByExpiry/ByNewest) بدل
    // تحميل كل الصفوف دفعة واحدة في الذاكرة — مهم مع نادٍ كبير (600+ عضو).
    implementation 'androidx.room:room-paging:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.paging:paging-runtime-ktx:3.2.1'

    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Sign in with Google (شاشة "حفظ البيانات على السحابة" — Onboarding 3 من 4)
    // ⚠️ الكود مكتمل ومعلَّق بانتظار إعداد خارجي من صاحب التطبيق — راجع الملاحظة
    // الكاملة أعلى OnboardingCloudActivity.kt قبل أي تعديل هنا.
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
