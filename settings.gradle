pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Required for 'com.github.PhilJay:MPAndroidChart' used in app/build.gradle
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "GymManager"
include ':app'
