// Top-level build file: declares plugin versions once, shared by all modules.
// Versions chosen for compatibility with Gradle 8.4 (see .github/workflows/build.yml)
// and JDK 17, and with compileSdk 34 used in app/build.gradle.
plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
    id 'org.jetbrains.kotlin.kapt' version '1.9.22' apply false
}
